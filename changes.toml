# ---------------------------------------------------------------- config edits (key-level, see rfopt/patches.py)
[[config]]
file = "config/modernfix-mixins.properties"
set = { "mixin.perf.dynamic_resources" = "true" }
reason = "bake block/item models on demand instead of all up front: the biggest client heap saving"

[[config]]
file = "config/modernfix-mixins.properties"
set = { "mixin.perf.clear_mixin_classinfo" = "true", "mixin.perf.deduplicate_location" = "true", "mixin.perf.dynamic_entity_renderers" = "true", "mixin.perf.deduplicate_climate_parameters" = "true", "mixin.perf.remove_spawn_chunks" = "true" }
reason = "free Mixin/ASM class data after load (~50 MB), share ResourceLocation strings (1M+ instances), build entity renderers on demand, share worldgen climate data, don't keep 441 spawn chunks loaded"

[[config]]
file = "config/ferritecore-mixin.toml"
set = { compactFastMap = "true" }
reason = "smaller blockstate property maps (slightly slower lookups, much less memory with this many blocks)"

[[config]]
file = "config/embeddium-options.json"
set = { "performance.chunk_builder_threads" = 2 }
reason = "fixed 2 chunk-build threads: each thread holds its own buffers, and an 8 GB PC is usually 4-6 cores"

[[config]]
file = "config/jei/jei-client.ini"
set = { "search.TooltipSearchMode" = "REQUIRE_PREFIX" }
reason = "JEI no longer indexes every item tooltip into its search tree (search tooltips with #)"

[[config]]
file = "config/supplementaries-client.toml"
set = { "blocks.wall_lantern.fast_lanterns" = "true", "blocks.hanging_sign.fast_signs" = "true" }
reason = "wall lanterns and hanging signs use baked models instead of per-block renderers"

[[config]]
file = "config/prettyrain.json5"
replace = [['"maxParticleAmount": 1500', '"maxParticleAmount": 600'], ['"particleDensity": 100', '"particleDensity": 60']]
reason = "fewer rain/snow particles alive at once (CPU + GPU); still clearly rainy"

[[config]]
file = "config/effective_fg-client.toml"
set = { "\"Water Effects\".\"splash abundance\"" = 2, "Cascades.\"cascade particles\"" = 0.5 }
reason = "fewer water splash / waterfall-mist particles"
