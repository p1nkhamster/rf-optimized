# Build definition for Raspberry Flavoured Optimized. Every change carries a reason.
[pack]
name = "Raspberry Flavoured Optimized"
version = "3.3.1-opt1"
# Unofficial: credit stays with the original pack author.
author = "raspmary (original pack); unofficial low-RAM build"
# Licenses that allow us to bundle a jar in overrides/ or the server pack. Anything else must come from CurseForge.
bundle_licenses = ["MIT", "LGPL-3.0-only", "LGPL-2.1-only", "GPL-3.0-only"]

[upstream]
project = 858803  # Raspberry Flavoured
file = 8714808    # 3.3.1

[jvm]
min_mb = 1024
max_mb = 3584
client_args = [
  "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=50", "-XX:+UnlockExperimentalVMOptions",
  "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:G1HeapRegionSize=16M",
  "-XX:+ParallelRefProcEnabled", "-XX:+UseStringDeduplication", "-XX:G1PeriodicGCInterval=30000",
  "-XX:MinHeapFreeRatio=10", "-XX:MaxHeapFreeRatio=30", "-XX:ReservedCodeCacheSize=256M",
]
test_args = [
  "-Xlog:gc*:file=logs/gc.log:uptime,level,tags", "-XX:NativeMemoryTracking=summary",
]
server_args = [
  "-Xms2G", "-Xmx4G",
  "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=100", "-XX:+UnlockExperimentalVMOptions",
  "-XX:G1NewSizePercent=30", "-XX:G1MaxNewSizePercent=40", "-XX:G1ReservePercent=20", "-XX:G1HeapRegionSize=8M",
  "-XX:+ParallelRefProcEnabled", "-XX:+UseStringDeduplication", "-XX:+DisableExplicitGC",
  "-XX:InitiatingHeapOccupancyPercent=15", "-XX:G1MixedGCLiveThresholdPercent=90",
  "-XX:SurvivorRatio=32", "-XX:+PerfDisableSharedMem", "-XX:MaxTenuringThreshold=1",
]

# ---------------------------------------------------------------- removals (CurseForge project ids)
[[remove]]
project = 908741
name = "Embeddium 0.3.18"
reason = "replaced by Embeddium 0.3.18.1 (bug-fix release)"

[[remove]]
project = 627566
name = "MemoryLeakFix 1.0.0"
reason = "replaced by MemoryLeakFix 1.1.5 (more leak fixes)"

[delete]
# Canary is not added: RoadRunner (already in the pack) is the same Lithium port, and both together crash at boot.
paths = ["config/canary.properties"]
override_mods = []

[server]
# CurseForge project ids of client-only mods (left out of dist/server).
client_only = [
  923755, 254284, 949555, 272515, 667872, 459701, 407206, 250398, 818759, 623800,
  557796, 628345, 844662, 568563, 448233, 852671, 686911, 1245453, 676136, 433760,
  852662, 958094, 433068, 570368, 832644, 693961, 411816, 907547, 910506, 271740,
  968891, 635427, 908741, 367706, 511770, 410295, 854176, 485245, 401648, 855017,
  511040, 520110, 499826, 326950, 308240, 1163800, 704256, 701437, 60089, 882495,
  551520, 905482, 334098,
]
client_only_files = []
# Client-only assets (resource packs, textures, sounds, menu art): servers never load them.
strip_paths = ["config/openloader/resources", "kubejs/assets", "config/fancymenu"]

[server.properties]
motd = "Raspberry Flavoured Optimized"
view-distance = 8
simulation-distance = 6
sync-chunk-writes = false
network-compression-threshold = 256
max-tick-time = -1
enable-command-block = false
allow-flight = true

